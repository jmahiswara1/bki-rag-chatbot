# Multi-turn topic isolation regression (Fase 8).
#
# Different from test_multiturn.yaml (which tests follow-up condense like
# L=150): here every subsequent turn is a NEW, self-contained question. The
# bug this locks against is the condense step echoing an earlier topic into
# the current en_query (e.g. emergency release leaking into an aluminium
# question), which then contaminates lookup + retrieval.
#
# Per turn:
#   - en_query_contains: the CURRENT topic must survive into en_query.
#   - must_not_contain: the PREVIOUS topic must NOT appear in the answer.
# Entry passes only if EVERY turn passes (run_eval._eval_multi_turn).

- id: iso_emergency_then_aluminium_then_skylight
  lang: id
  category: multi_turn
  turns:
    - question: Berapa waktu maksimum yang diizinkan untuk berfungsinya sistem rilis darurat (emergency release system) pada derek tunda setelah diaktifkan?
      expected_sources:
      - section_no: 27
      en_query_contains:
      - "emergency release"
      must_include:
      - "3"
    - question: Seri paduan aluminium apa saja yang diizinkan untuk digunakan pada struktur lambung kapal?
      expected_sources:
      - section_no: 2
      en_query_contains:
      - "aluminium"
      must_not_contain:
      - "emergency"
      - "rilis darurat"
    - question: Bagaimana ketentuan desain untuk jendela atap (skylights) pada kamar pompa kargo kapal tanker terkait material dan kaca?
      expected_sources:
      - section_no: 22
      en_query_contains:
      - "skylight"
      must_not_contain:
      - "aluminium"
      - "emergency"

- id: iso_bulwark_supply_then_generic
