      - "kapal suplai"

- id: iso_collision_barge_then_frame_spacing
  lang: id
  category: multi_turn
  turns:
    - question: Di manakah posisi sekat tubrukan pada tongkang (barge)?
      expected_sources:
      - section_no: 31
      en_query_contains:
      - "barge"
    - question: Berapakah jarak gading maksimum di depan sekat tubrukan?
      expected_sources:
      - section_no: 9
      - section_no: 11
      en_query_contains:
      - "spacing"
      must_not_contain:
      - "barge"
      - "0,05Lcon"

- id: iso_cargo_hold_then_dredger
  lang: id
  category: multi_turn
  turns:
    - question: Berapakah ketebalan pelat minimum mutlak yang disyaratkan untuk sekat ruang muat kargo (cargo hold bulkheads) pada kapal curah?
      expected_sources:
      - section_no: 23
      must_include:
      - "9,0"
    - question: Pada kapal keruk (dredgers) yang dirancang atau diperkirakan akan beroperasi dalam kondisi kandas (aground), berapakah spasi maksimum yang diizinkan untuk bottom transverses?
      expected_sources:
      - section_no: 32
      en_query_contains:
      - "dredger"
      - "aground"
      must_include:
      - "1,8"
      must_not_contain:
      - "sekat ruang muat"
      - "cargo hold"
